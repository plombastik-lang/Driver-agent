<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Driver Agent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Driver Agent</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">C2V · prototype</div>
        <h1>Driver Agent</h1>
        <p>Агент управления драйверами</p>
      </div>
      <button id="installButton" class="install-btn" hidden>Установить</button>
    </header>

    <section class="summary-card">
      <div><span id="driverCount">1</span><small>драйверов</small></div>
      <div><span id="draftCount">0</span><small>черновиков</small></div>
      <div><span id="readyCount">1</span><small>готово</small></div>
    </section>

    <nav class="tabs" aria-label="Разделы">
      <button class="tab active" data-tab="chat">Диалог</button>
      <button class="tab" data-tab="registry">Реестр</button>
    </nav>

    <section id="chat" class="panel active">
      <div id="messages" class="messages"></div>
      <div class="quick-actions">
        <button data-prompt="Создай драйвер количества выдач по ипотеке">Ипотека</button>
        <button data-prompt="Создай драйвер количества продаж по картам">Карты</button>
        <button data-prompt="Создай драйвер объёма сборов по страхованию">Страхование</button>
      </div>
      <form id="composer" class="composer">
        <textarea id="prompt" rows="2" placeholder="Например: создай драйвер количества клиентов по вкладам"></textarea>
        <button type="submit">Создать драйвер</button>
      </form>
    </section>

    <section id="registry" class="panel">
      <div class="registry-head">
        <div>
          <h2>Реестр драйверов</h2>
          <p>Созданные агентом записи сохраняются на этом iPhone.</p>
        </div>
        <button id="resetButton" class="ghost-danger">Сбросить</button>
      </div>
      <div id="driverList" class="driver-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
